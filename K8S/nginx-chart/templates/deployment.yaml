apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.depname }}
  labels:
    app: {{ .Values.lable }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.lable }}
  template:
    metadata:
      labels:
        app: {{ .Values.lable }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80