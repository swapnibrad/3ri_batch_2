apiVersion: v1
kind: Service
metadata:
  name: 3ri-nginx-svc
spec:
  selector:
    app: myapp
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-deployment
spec:
  selector:
    source: pristine
    environment: development
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 81