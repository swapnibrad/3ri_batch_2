{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  ports:
  - port: 3306
    name: mysql
  clusterIP: None
  selector:
    app: mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: "mariadb"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
  spec:
    containers:
    - name: mariadb
      image: {{ .Values.mariadb.image }}
      ports:
      - containerPort: 3306
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: database
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: password
          volumeMounts:
          - name: mariadb-storage
            mountPath: /var/lib/mysql
volumeClaimTemplates:
- metadata:
    name: mariadb-storage
  spec:
    accessModes: [ "ReadWriteOnce" ]
    resources:
      requests:
        storage: {{ .Values.mariadb.storage.size }}
{{- if .Values.mariadb.storage.storageClass }}
        storageClassName: "{{ .Values.mariadb.storage.storageClass }}"
{{- end }}
{{- end }}